[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soro-boro"
version = "0.2.1"
description = "Soro-Kev: Calibration-Aware System-One Tool Router (4B & 0.8B) on Qwen3 Decision Models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "torch>=2.0",
  "transformers>=4.40",
  "peft>=0.10.0",
  "safetensors>=0.4.0",
  "huggingface-hub>=0.20",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "gradio>=4.0",
]

[project.scripts]
soro = "soro.cli:main"
soro-audit = "soro.cli_audit:main"

[tool.setuptools.packages.find]
where = ["veyra/python/src"]

[tool.setuptools.package-data]
"soro" = ["dashboard.html"]
"soro.v1" = ["*.pyi"]
