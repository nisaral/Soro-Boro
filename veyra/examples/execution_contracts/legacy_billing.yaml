version: "veyra.spec/v1alpha1"
operation: legacy_billing.send_invoice
description: "Legacy un-idempotent billing notification dispatch"
side_effect_class: non_idempotent_mutation
reversibility: irreversible

idempotency:
  supported: false

evidence_probes:
  status_lookup:
    supported: false
  read_back_consistency: none

compensation:
  supported: false

execution_bounds:
  max_in_flight_timeout_ms: 30000
  safe_recovery_policy: "strict_risk_bounded"
  max_acceptable_duplicate_risk: 0.00
