[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soro-boro"
version = "0.2.1"
description = "Middleware between agents and tools: contract filter, verify-before-replay on unknown ack, abstain when unsure."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "grpcio>=1.60",
  "protobuf>=4.25",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "huggingface-hub>=0.20",
]

[project.optional-dependencies]
harbor = ["harbor==0.24.0"]
langgraph = ["langgraph>=0.2"]
miniswe = ["mini-swe-agent>=2"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "grpcio-tools>=1.60", "harbor==0.24.0"]

[project.scripts]
soro = "soro.cli:main"
soro-audit = "soro.cli_audit:main"
veyra = "soro.cli:main"
veyra-py = "soro.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# keep third-party pytest plugins quiet; the suite is fully synchronous
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"soro" = ["dashboard.html"]
"soro.v1" = ["*.pyi"]
"veyra" = ["dashboard.html"]
"veyra.v1" = ["*.pyi"]