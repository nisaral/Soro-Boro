# Declarative Harbor job sketch. Confirm the custom-agent API before a paid run.
# https://github.com/laude-institute/harbor
#
# uv run harbor run --dataset terminal-bench@2.0 --agent terminus-2 --n-concurrent 1
# Pilot 20 tasks first. Mid-strength model. Three seeds.

job_name: veyra-tb2-pilot
dataset: terminal-bench@2.0
n_concurrent_trials: 1
agents:
  - name: terminus-2
  - name: mini-swe-agent
  - name: veyra   # register after the Harbor custom-agent adapter exists
seeds: [0, 1, 2]
notes: |
  Fail-open: if the Veyra controller errors, continue on the current harness.
  Shadow: log would-have-switched without acting until Gate 1.
