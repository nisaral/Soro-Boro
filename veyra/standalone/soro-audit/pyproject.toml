[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soro-audit"
version = "0.1.0"
description = "Audits Model Context Protocol (MCP) servers for missing annotations, spec default risks, and behavioral discrepancies."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Soro Project Authors" }
]
keywords = ["mcp", "model-context-protocol", "audit", "linter", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
soro-audit = "soro_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soro_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
