name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: vet
        run: go vet ./internal/... ./cmd/...
      - name: build
        run: go build -o /tmp/veyra ./cmd/veyra
      - name: test
        run: go test ./internal/...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./python[dev,harbor]"
      - name: offline test suite and contract tests
        run: |
          pytest python/tests -v
      - name: schema validation and golden tests
        run: |
          pytest python/tests/test_handoff_golden.py -v
      - name: headroom unit test on synthetic data
        run: |
          python -m veyra.cli headroom --trials python/tests/data/synthetic_trials.csv --out out/ci_headroom.md

  wire-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install protoc + plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          python -m pip install --upgrade pip grpcio-tools
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: regenerate and diff
        run: make proto-check
