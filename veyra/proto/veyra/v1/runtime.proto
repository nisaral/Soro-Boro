// Veyra runtime contract.
//
// Three services, one wire format:
//   KernelService  : CLI/SDK  -> kernel   (submit, watch, inspect, cancel)
//   DecisionService: kernel   -> python   (which action next?)
//   HarnessService : kernel   -> python   (execute an action inside a harness)
//
// The design rule from the plan is enforced by this shape: a DecisionModel can
// only ever return a Decision. It never touches a tool, shell or workspace.
syntax = "proto3";

package veyra.v1;

option go_package = "github.com/nisaral/veyra/gen/veyra/v1;veyrav1";

// ---------------------------------------------------------------------------
// core types
// ---------------------------------------------------------------------------

message Budget {
  int64  max_actions  = 1;
  double max_usd      = 2;
  int64  max_wall_ms  = 3;
  int64  max_tokens   = 4;
}

message BudgetUsage {
  int64  actions = 1;
  double usd     = 2;
  int64  wall_ms = 3;
  int64  tokens  = 4;
}

message Message {
  string role    = 1;
  string content = 2;
}

message Artifact {
  string path   = 1;
  string kind   = 2;
  string sha256 = 3;
  int64  bytes  = 4;
}

message ToolResult {
  string tool   = 1;
  bool   ok     = 2;
  string output = 3;
  double usd    = 4;
}

// CommonExecutionState is the portable checkpoint contract.
//
// A harness adapter maps this <-> its own internal state. Harness switching is
// only ever performed at a checkpoint, never by reaching into another runtime's
// private graph state.
message CommonExecutionState {
  string                 task_id       = 1;
  string                 instruction   = 2;
  repeated Message       messages      = 3;
  repeated Artifact      artifacts     = 4;
  map<string, string>    variables     = 5;
  repeated ToolResult    tool_results  = 6;
  string                 workspace     = 7;
  BudgetUsage            usage         = 8;
  int64                  step          = 9;
  string                 harness_id    = 10;
  string                 checkpoint_id = 11;
  repeated string        observations  = 12;
  bool                   done          = 13;
  bool                   failed        = 14;
  string                 failure_kind  = 15;
}

message TaskSpec {
  string              id                    = 1;
  string              instruction           = 2;
  string              workspace             = 3;
  map<string, string> metadata              = 4;
  Budget              budget                = 5;
  repeated string     required_capabilities = 6;
  repeated string     category              = 7;
}

// ---------------------------------------------------------------------------
// decisions
// ---------------------------------------------------------------------------

enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  MODEL_CALL              = 1;
  TOOL_CALL               = 2;
  VERIFY                  = 3;
  RETRY                   = 4;
  SWITCH_HARNESS          = 5;
  TERMINATE               = 6;
}

message ActionCandidate {
  string          id                   = 1;
  ActionType      type                 = 2;
  string          provider             = 3;
  repeated string capabilities         = 4;
  double          est_cost_usd         = 5;
  int64           est_latency_ms       = 6;
  double          expected_success     = 7;
  double          risk                 = 8;
  repeated string required_permissions = 9;
  // json payload: model name, tool name, target harness, etc.
  string          payload_json         = 10;
  string          rationale            = 11;
}

message DecisionRequest {
  CommonExecutionState     state         = 1;
  repeated ActionCandidate candidates    = 2;
  // which question is being asked, e.g. "next_action" | "verify?" | "switch?"
  string                   question      = 3;
  Budget                   budget        = 4;
  BudgetUsage              usage         = 5;
  // requested backend: heuristic | von | bandit | oracle | fixed
  string                   backend       = 6;
}

message Decision {
  repeated string candidate_ids = 1;
  repeated double probabilities = 2;
  string          chosen_id     = 3;
  double          confidence    = 4;
  string          policy_id     = 5;
  // heuristic | von | bandit | oracle | fixed
  string          backend       = 6;
  double          latency_ms    = 7;
  string          rationale     = 8;
}

service DecisionService {
  rpc Decide(DecisionRequest) returns (Decision);
}

// ---------------------------------------------------------------------------
// harness execution
// ---------------------------------------------------------------------------

message StartRequest {
  string               harness_id = 1;
  TaskSpec             task       = 2;
  CommonExecutionState state      = 3;
  // json: harness-specific options (model, endpoints, limits)
  string               options_json = 4;
  // kernel run id: a harness session belongs to exactly one run
  string               run_id       = 5;
}

message StartResponse {
  string               run_id = 1;
  CommonExecutionState state  = 2;
}

message StepRequest {
  string               run_id   = 1;
  CommonExecutionState state    = 2;
  Decision             decision = 3;
}

message StepResponse {
  CommonExecutionState state          = 1;
  bool                 needs_decision = 2;
}

enum ControlOp {
  CONTROL_OP_UNSPECIFIED = 0;
  PAUSE                  = 1;
  RESUME                 = 2;
  INTERRUPT              = 3;
  TERMINATE_RUN          = 4;
}

message ControlRequest {
  string    run_id     = 1;
  string    harness_id = 2;
  ControlOp op         = 3;
}

message ControlResponse {
  bool   ok    = 1;
  string error = 2;
}

message InspectRequest {
  string run_id     = 1;
  string harness_id = 2;
}

message InspectResponse {
  CommonExecutionState state            = 1;
  bool                 alive            = 2;
  string               harness_meta_json = 3;
}

message HarnessInfo {
  string          id                   = 1;
  string          kind                 = 2;
  repeated string capabilities         = 3;
  double          est_cost_usd_per_step = 4;
  int64           est_latency_ms       = 5;
  bool            supports_checkpoint  = 6;
  repeated string required_permissions = 7;
}

message ListHarnessesRequest {}

message ListHarnessesResponse {
  repeated HarnessInfo harnesses = 1;
}

service HarnessService {
  rpc Start(StartRequest) returns (StartResponse);
  rpc Step(StepRequest) returns (StepResponse);
  rpc Control(ControlRequest) returns (ControlResponse);
  rpc Inspect(InspectRequest) returns (InspectResponse);
  rpc ListHarnesses(ListHarnessesRequest) returns (ListHarnessesResponse);
}

// ---------------------------------------------------------------------------
// kernel control plane
// ---------------------------------------------------------------------------

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  PENDING                = 1;
  RUNNING                = 2;
  PAUSED                 = 3;
  SUCCEEDED              = 4;
  FAILED                 = 5;
  CANCELLED              = 6;
  BUDGET_EXCEEDED        = 7;
  SWITCHED               = 8;
}

message SubmitRequest {
  TaskSpec task = 1;
  // heuristic | von | bandit | oracle | fixed:native | fixed:langgraph
  string   policy_backend = 2;
  string   start_harness  = 3;
  // json: options forwarded to the harness
  string   options_json   = 4;
  string   run_id         = 5;
}

message SubmitResponse {
  string run_id = 1;
}

message RunEvent {
  string               run_id      = 1;
  int64                seq         = 2;
  int64                ts_ms       = 3;
  // task_started | decision | action | observation | checkpoint | harness_switch
  // | failure | verify | budget | run_finished
  string               kind        = 4;
  RunStatus            status      = 5;
  string               json_payload = 6;
  CommonExecutionState state       = 7;
  Decision             decision    = 8;
  ActionCandidate      action      = 9;
  BudgetUsage          usage       = 10;
}

message WatchRequest { string run_id = 1; }

message GetRunRequest { string run_id = 1; }

message RunRecord {
  string               run_id     = 1;
  RunStatus            status     = 2;
  TaskSpec             task       = 3;
  CommonExecutionState state      = 4;
  BudgetUsage          usage      = 5;
  Budget               budget     = 6;
  int64                started_ms = 7;
  int64                ended_ms   = 8;
  string               error      = 9;
  // one json object per line, replayable by `veyra replay`
  repeated RunEvent    events     = 10;
  repeated string      checkpoints = 11;
}

message CancelRequest { string run_id = 1; }
message CancelResponse { bool ok = 1; }

service KernelService {
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  rpc Watch(WatchRequest) returns (stream RunEvent);
  rpc GetRun(GetRunRequest) returns (RunRecord);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc ListHarnesses(ListHarnessesRequest) returns (ListHarnessesResponse);
}