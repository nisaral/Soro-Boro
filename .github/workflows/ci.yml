name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Mathematical Reconciliation & Benchmark Verification Tests
        run: |
          pytest veyra/python/tests/test_benchmark_reconciliation.py -v

      - name: Run SoroHarness End-to-End Smoke Test
        run: |
          python -c "
          from soro import SoroHarness
          harness = SoroHarness()
          @harness.tool(description='Check customer current plan and remaining data balance')
          def get_user_plan(customer_id: str):
              return {'status': 'active', 'id': customer_id}
          res = harness.route('What plan is user 123 on?')
          print('Route result:', res.action, res.selected_tool)
          out = harness.call(get_user_plan, {'user_id': '123'})
          assert out.value['id'] == '123', 'Semantic repair failed'
          print('Harness smoke test passed successfully!')
          "
